
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My DevOps To-Do App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f4f6f8;
        }

        h1, h2 {
            text-align: center;
        }

        form {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 10px;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }

        li {
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <h1>My DevOps To-Do App</h1>

    <form action="/add" method="POST">
        <input type="text" name="task"
               placeholder="Enter a task" required>
        <button type="submit">Add Task</button>
    </form>

    <h2>My Tasks</h2>

    <ul>
        {% for task in tasks %}
        <li>
            {{ task }}
            <form action="/delete/{{ loop.index0 }}"
                  method="POST" style="display:inline;">
                <button type="submit">Delete</button>
            </form>
        </li>
        {% else %}
        <li>No tasks yet. Add your first task!</li>
        {% endfor %}
    </ul>
</body>
</html>
